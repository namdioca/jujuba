<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suporte — Mizzle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,400;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <form class="form-card" id="suporte-form">
      <div class="form-card-header">Fale com o suporte</div>
      <div class="form-card-body">
        <div class="field">
          <label for="assunto">Assunto</label>
          <input id="assunto" name="assunto" required />
        </div>
        <div class="field">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao" required></textarea>
        </div>
        <button class="btn-primary" type="submit">Enviar</button>
      </div>
      <div class="form-card-footer"></div>
    </form>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/fallback-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script>
    Store.seedGamesIfNeeded().then(Pages.initSuporte);
  </script>
</body>
</html>
