<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Mizzle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,400;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <form class="form-card" id="login-form">
      <div class="form-card-header">Entrar na Mizzle</div>
      <div class="form-card-body">
        <div class="field">
          <label for="identificador">Nome de usuário ou e-mail</label>
          <input id="identificador" name="identificador" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" required autocomplete="current-password" />
        </div>
        <div class="checkbox-row">
          <input id="lembrar" type="checkbox" />
          <label for="lembrar">Mantenha-me conectado</label>
        </div>
        <button class="btn-primary" type="submit">Entrar</button>
        <div class="form-links">
          <a class="link-muted" href="#" onclick="UI.showToast('Um link de recuperação foi enviado para o seu e-mail.'); return false;">Esqueci a senha</a>
          <a class="link-muted" href="cadastro.html">Criar conta</a>
        </div>
      </div>
      <div class="form-card-footer"></div>
    </form>
    <p class="form-note">Dica: crie uma conta na página de cadastro para poder entrar.</p>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/fallback-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script>
    Store.seedGamesIfNeeded().then(Pages.initLogin);
  </script>
</body>
</html>
